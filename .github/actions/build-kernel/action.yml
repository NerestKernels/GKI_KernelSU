name: 'Build Kernel'
description: 'Builds GKI kernels with the latest Neutron Clang using build.sh or Kleaf'
inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.1)'
    required: true
  page_size:
    description: 'ARM64 page size: 4k (default) or 16k'
    required: false
    type: string
    default: '4k'
  allow_version_mismatch:
    description: 'Whether to force-load version-mismatched modules'
    required: false
    type: boolean
    default: false
runs:
  using: composite
  steps:
    - name: Install latest Neutron Clang
      shell: bash
      env:
        NEUTRON_DIR: ${{ github.workspace }}/toolchains/neutron-clang
      run: |
        set -euo pipefail
        mkdir -p "$NEUTRON_DIR"
        cd "$NEUTRON_DIR"
        curl --fail --location --retry 5 --retry-delay 3 --retry-all-errors \
          https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman \
          --output antman
        chmod +x antman
        # AntMan resolves 'latest' from clang-build-catalogue/latest.txt and
        # verifies the downloaded release against the catalogue's SHA-256.
        ./antman --sync=latest --noconfirm --noprogress
        test -x "$NEUTRON_DIR/bin/clang"
        test -x "$NEUTRON_DIR/bin/ld.lld"
        echo "$NEUTRON_DIR/bin" >> "$GITHUB_PATH"
        echo "NEUTRON_CLANG_BIN=$NEUTRON_DIR/bin" >> "$GITHUB_ENV"
        "$NEUTRON_DIR/bin/clang" --version | head -n 1
        grep -A1 '^\[tag\]' "$NEUTRON_DIR/build.info" || true

    - name: 'Build Kernel (build.sh)'
      # Android 12/13 GKI source trees use the legacy build/build.sh flow.
      if: startsWith(inputs.version, 'android12') || startsWith(inputs.version, 'android13')
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        if [ "${{ inputs.page_size }}" != "4k" ]; then
          echo "ERROR: page_size=${{ inputs.page_size }} is only supported by the Kleaf (Bazel) build; this tree uses build/build.sh." >&2
          exit 1
        fi
        test -x "$NEUTRON_CLANG_BIN/clang"
        # build.sh normally selects Google's in-tree prebuilt clang from this
        # build config. Override that selection so the legacy GKI build uses
        # the same Neutron release installed above.
        BUILD_CONFIG_FILE="common/build.config.gki.aarch64"
        if [ ! -f "$BUILD_CONFIG_FILE" ]; then
          echo "ERROR: missing $BUILD_CONFIG_FILE" >&2
          exit 1
        fi
        if ! grep -q 'Neutron Clang injected by CI' "$BUILD_CONFIG_FILE"; then
          printf '\n# Neutron Clang injected by CI\nCLANG_PREBUILT_BIN="%s"\n' \
            "$NEUTRON_CLANG_BIN" >> "$BUILD_CONFIG_FILE"
        fi

        cp "${{ github.workspace }}/.github/actions/build-kernel/legacy-fragment.config" legacy-fragment.config
        export BUILD_CONFIG_FRAGMENTS="legacy-fragment.config"
        BUILD_GKI_ARTIFACTS="" \
        BUILD_GKI_CERTIFICATION_TOOLS=0 \
        BUILD_SYSTEM_DLKM=0 \
        SKIP_VENDOR_BOOT=1 \
        SKIP_EXT_MODULES=1 \
        SKIP_CP_KERNEL_HDR=1 \
        OUT_DIR="/home/runner/out" \
        LTO=full \
        BUILD_CONFIG="$BUILD_CONFIG_FILE" \
        build/build.sh -j"$(nproc)"

    - name: 'Build Kernel (Kleaf)'
      if: ${{ !startsWith(inputs.version, 'android12') && !startsWith(inputs.version, 'android13') }}
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        test -x "$NEUTRON_CLANG_BIN/clang"
        # Kleaf toolchain selection is partly hermetic and repository-specific.
        # Export the Neutron compiler into repository and build actions, as well
        # as PATH, so GKI rules that honor the external compiler environment use it.
        # (A Kleaf tree that hard-pins its own compiler repository must update that
        # rule/toolchain definition; PATH alone cannot override an absolute tool.)
        export PATH="$NEUTRON_CLANG_BIN:$PATH"
        BUILD_CONFIG_FILE="common/build.config.gki.aarch64"
        if [ -f "$BUILD_CONFIG_FILE" ]; then
          if ! grep -q 'Reproducible timestamp injected by the CI workflow' "$BUILD_CONFIG_FILE"; then
            printf '\n# Reproducible timestamp injected by the CI workflow.\nexport SOURCE_DATE_EPOCH=%q\nexport KBUILD_BUILD_TIMESTAMP=%q\n' \
              "${SOURCE_DATE_EPOCH:-0}" "${KBUILD_BUILD_TIMESTAMP:-@0}" >> "$BUILD_CONFIG_FILE"
          fi
        else
          echo "::warning title=build timestamp::$BUILD_CONFIG_FILE not present - Kleaf will stamp the build itself"
        fi
        PAGE_SIZE_FLAGS=()
        if [ "${{ inputs.page_size }}" = "16k" ]; then
          PAGE_SIZE_FLAGS+=(--page_size=16k)
        fi
        tools/bazel build \
          --config=fast \
          --lto=full \
          --repo_env="CLANG_PREBUILT_BIN=$NEUTRON_CLANG_BIN" \
          --repo_env="PATH=$PATH" \
          --action_env="PATH=$PATH" \
          "${PAGE_SIZE_FLAGS[@]}" \
          --defconfig_fragment=//common:wild_defconfig.fragment \
          //common:kernel_aarch64

    - name: 'Verify Page Size in Generated .config'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        PAGE_SIZE="${{ inputs.page_size }}"
        CONFIG_FILE=""
        for candidate in \
          bazel-bin/common/kernel_aarch64_config/out_dir/.config \
          /home/runner/out/.config; do
          if [ -f "$candidate" ]; then CONFIG_FILE="$candidate"; break; fi
        done
        if [ -z "$CONFIG_FILE" ]; then
          CONFIG_FILE="$(find bazel-bin/common /home/runner/out -maxdepth 4 -name .config -type f 2>/dev/null | head -n1 || true)"
        fi
        if [ -z "$CONFIG_FILE" ]; then
          if [ "$PAGE_SIZE" != "16k" ]; then
            echo "WARNING: no .config found; skipping page-size verification for 4k."
            exit 0
          fi
          echo "ERROR: could not locate the generated .config; page size cannot be verified." >&2
          exit 1
        fi
        echo "Verifying page size using $CONFIG_FILE"
        grep -E '^(# )?CONFIG_ARM64_(4K|16K|64K)_PAGES|^CONFIG_ARM64_PAGE_SHIFT' "$CONFIG_FILE" || true
        echo "--- KSU config block from $CONFIG_FILE ---"
        grep -E '^#? ?CONFIG_KSU' "$CONFIG_FILE" || echo '(no CONFIG_KSU entries in final .config)'
        if [ "${ROOT_IMPLEMENTATION:-}" != '' ] && [ "${ROOT_IMPLEMENTATION:-}" != 'none' ]; then
          if ! grep -q '^CONFIG_KSU=y' "$CONFIG_FILE"; then
            echo "ERROR: CONFIG_KSU missing from final .config (root: $ROOT_IMPLEMENTATION)" >&2
            exit 1
          fi
          if [ -n "${SUSFS_COMMIT:-}" ] && ! grep -q '^CONFIG_KSU_SUSFS=y' "$CONFIG_FILE"; then
            echo "ERROR: CONFIG_KSU_SUSFS missing from final .config (root: $ROOT_IMPLEMENTATION, susfs ${SUSFS_COMMIT})" >&2
            exit 1
          fi
        fi
        if [ "$PAGE_SIZE" = "16k" ]; then
          want_on="CONFIG_ARM64_16K_PAGES=y"
          want_off="# CONFIG_ARM64_4K_PAGES is not set"
        else
          want_on="CONFIG_ARM64_4K_PAGES=y"
          want_off="# CONFIG_ARM64_16K_PAGES is not set"
        fi
        if ! grep -qx "$want_on" "$CONFIG_FILE"; then
          echo "ERROR: expected '$want_on' in $CONFIG_FILE" >&2
          grep -E '^(# )?CONFIG_ARM64_(4K|16K|64K)_PAGES' "$CONFIG_FILE" >&2 || true
          exit 1
        fi
        if ! grep -qx "$want_off" "$CONFIG_FILE"; then
          echo "ERROR: expected '$want_off' in $CONFIG_FILE" >&2
          grep -E '^(# )?CONFIG_ARM64_(4K|16K|64K)_PAGES' "$CONFIG_FILE" >&2 || true
          exit 1
        fi
        echo "Page size verified: ${PAGE_SIZE}"

    - name: 'Gather Build Artifacts'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        if [ -f "bazel-bin/common/kernel_aarch64/Image" ]; then
          echo "Found Image at bazel-bin/common/kernel_aarch64/Image"
          cp "bazel-bin/common/kernel_aarch64/Image" "${{ github.workspace }}/AnyKernel3/Image"
          exit 0
        fi
        if [ -f "/home/runner/out/dist/Image" ]; then
          echo "Found Image at /home/runner/out/dist/Image"
          cp "/home/runner/out/dist/Image" "${{ github.workspace }}/AnyKernel3/Image"
          exit 0
        fi
        echo "ERROR: built GKI Image was not found" >&2
        exit 1
