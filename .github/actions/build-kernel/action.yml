name: 'Build Kernel'
description: 'Builds GKI kernels with the latest Neutron Clang using direct Kbuild'
inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.1)'
    required: true
  page_size:
    description: 'ARM64 page size: 4k or 16k'
    required: false
    type: string
    default: '4k'
  allow_version_mismatch:
    description: 'Whether to force-load version-mismatched modules'
    required: false
    type: boolean
    default: false

runs:
  using: composite
  steps:
    - name: Install latest Neutron Clang
      shell: bash
      env:
        NEUTRON_DIR: ${{ github.workspace }}/toolchains/neutron-clang
      run: |
        set -euo pipefail
        mkdir -p "$NEUTRON_DIR"
        cd "$NEUTRON_DIR"

        curl --fail --location --retry 5 --retry-delay 3 --retry-all-errors \
          https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman \
          --output antman
        chmod +x antman
        ./antman --sync=latest --noconfirm --noprogress

        test -x "$NEUTRON_DIR/bin/clang"
        test -x "$NEUTRON_DIR/bin/ld.lld"
        echo "$NEUTRON_DIR/bin" >> "$GITHUB_PATH"
        echo "NEUTRON_CLANG_BIN=$NEUTRON_DIR/bin" >> "$GITHUB_ENV"

        "$NEUTRON_DIR/bin/clang" --version | head -n 1
        grep -A1 '^\[tag\]' "$NEUTRON_DIR/build.info" || true

    - name: Build GKI kernel with Neutron LLVM
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        test -x "$NEUTRON_CLANG_BIN/clang"
        test -x "$NEUTRON_CLANG_BIN/ld.lld"
        test -f common/Makefile
        test -f common/arch/arm64/configs/gki_defconfig || {
          echo "::error title=missing GKI defconfig::common/arch/arm64/configs/gki_defconfig was not found"
          exit 1
        }

        export PATH="$NEUTRON_CLANG_BIN:$PATH"
        export ARCH=arm64 SUBARCH=arm64
        export LLVM=1 LLVM_IAS=1
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_COMPAT=aarch64-linux-gnu-
        export CC="ccache $NEUTRON_CLANG_BIN/clang"
        export HOSTCC="ccache $NEUTRON_CLANG_BIN/clang"
        export LD="$NEUTRON_CLANG_BIN/ld.lld"
        export HOSTLD="$NEUTRON_CLANG_BIN/ld.lld"
        export AR="$NEUTRON_CLANG_BIN/llvm-ar"
        export NM="$NEUTRON_CLANG_BIN/llvm-nm"
        export OBJCOPY="$NEUTRON_CLANG_BIN/llvm-objcopy"
        export OBJDUMP="$NEUTRON_CLANG_BIN/llvm-objdump"
        export STRIP="$NEUTRON_CLANG_BIN/llvm-strip"

        echo "Compiler: $($NEUTRON_CLANG_BIN/clang --version | head -n 1)"
        echo "Linker: $($NEUTRON_CLANG_BIN/ld.lld --version)"

        MAKE_JOBS="$(nproc --all)"
        OUT_DIR="/home/runner/out"
        OUT="$OUT_DIR/common"
        mkdir -p "$OUT"

        MAKE_FLAGS=(
          LLVM=1 LLVM_IAS=1
          LD="$LD" HOSTLD="$HOSTLD"
          AR="$AR" NM="$NM"
          OBJCOPY="$OBJCOPY" OBJDUMP="$OBJDUMP" STRIP="$STRIP"
          CC="$CC" HOSTCC="$HOSTCC"
          O="$OUT"
        )

        # GKI manifests place the actual kernel Makefile under common/; invoking
        # make from the manifest checkout root has no kernel targets.
        make -C common -j"$MAKE_JOBS" "${MAKE_FLAGS[@]}" gki_defconfig

        CONFIG="$OUT/.config"
        test -s "$CONFIG"
        FRAGMENT="common/wild_defconfig.fragment"
        if [ -s "$FRAGMENT" ]; then
          common/scripts/kconfig/merge_config.sh -m -O "$OUT" "$CONFIG" "$FRAGMENT"
        else
          echo "::error title=missing wild fragment::$FRAGMENT not found or empty"
          exit 1
        fi

        # Retain the NTSYNC override previously supplied by the legacy build
        # fragment, and apply the requested ARM64 page size before resolution.
        if grep -q '^config NTSYNC\|^menuconfig NTSYNC' common/drivers/misc/Kconfig common/drivers/misc/*/Kconfig 2>/dev/null; then
          common/scripts/config --file "$CONFIG" --enable NTSYNC
        fi
        case "${{ inputs.page_size }}" in
          4k)
            common/scripts/config --file "$CONFIG" --enable ARM64_4K_PAGES --disable ARM64_16K_PAGES
            ;;
          16k)
            common/scripts/config --file "$CONFIG" --enable ARM64_16K_PAGES --disable ARM64_4K_PAGES
            ;;
          *)
            echo "::error title=invalid page size::Unsupported page_size=${{ inputs.page_size }} (expected 4k or 16k)"
            exit 1
            ;;
        esac

        make -C common -j"$MAKE_JOBS" "${MAKE_FLAGS[@]}" olddefconfig

        echo "Building Image and modules with Neutron Clang (jobs=$MAKE_JOBS)"
        set -o pipefail
        make -C common -j"$MAKE_JOBS" "${MAKE_FLAGS[@]}" Image modules 2>&1 | tee build.log

        test -s "$CONFIG"
        if [ ! -s "$OUT/arch/arm64/boot/Image" ]; then
          tail -n 100 build.log || true
          echo "::error title=missing kernel image::Kernel Image was not produced"
          exit 1
        fi
        mkdir -p "${{ github.workspace }}/AnyKernel3"
        cp "$OUT/arch/arm64/boot/Image" "${{ github.workspace }}/AnyKernel3/Image"

        echo "Post-build ccache statistics:"
        ccache -s

    - name: Verify generated configuration
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        CONFIG_FILE="/home/runner/out/common/.config"
        test -s "$CONFIG_FILE"

        if [ "${{ inputs.page_size }}" = "16k" ]; then
          grep -qx 'CONFIG_ARM64_16K_PAGES=y' "$CONFIG_FILE"
          grep -qx '# CONFIG_ARM64_4K_PAGES is not set' "$CONFIG_FILE"
        else
          grep -qx 'CONFIG_ARM64_4K_PAGES=y' "$CONFIG_FILE"
          grep -qx '# CONFIG_ARM64_16K_PAGES is not set' "$CONFIG_FILE"
        fi

        echo "Verified config: $CONFIG_FILE"
