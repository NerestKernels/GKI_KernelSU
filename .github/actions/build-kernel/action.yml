name: 'Build Kernel'
description: 'Builds GKI kernel using custom clang from greenforce_clang'
inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.1)'
    required: true
  page_size:
    description: 'ARM64 page size: 4k (default, unchanged behaviour) or 16k'
    required: false
    type: string
    default: '4k'
  allow_version_mismatch:
    description: 'Whether to force-load version-mismatched modules'
    required: false
    type: boolean
    default: false

runs:
  using: composite
  steps:
    - name: Setup Kernel Configs
      if: false
      uses: ./.github/actions/set-kernel-config

    - name: Checkout greenforce_clang (custom clang)
      uses: actions/checkout@v6
      with:
        repository: greenforce-project/greenforce_clang
        ref: main
        path: greenforce_clang

    - name: Install greenforce clang and expose to PATH
      shell: bash
      run: |
        set -euo pipefail
        cd "${{ github.workspace }}/greenforce_clang" || exit 1
        chmod +x get_clang.sh || true

        ./get_clang.sh || true

        CLANG_BIN_DIR=""
        CLANG_PATH=$(find . -type f -path "*/bin/clang" -print -quit || true)
        if [ -n "$CLANG_PATH" ]; then
          CLANG_BIN_DIR=$(dirname "$CLANG_PATH")
        fi

        if [ -z "$CLANG_BIN_DIR" ] && command -v clang >/dev/null 2>&1; then
          CLANG_BIN_DIR="$(dirname "$(command -v clang)")"
        fi

        if [ -n "$CLANG_BIN_DIR" ] && [ -x "$CLANG_BIN_DIR/clang" ]; then
          echo "CLANG_BIN_PATH=$CLANG_BIN_DIR" >> "$GITHUB_ENV"
          echo "$CLANG_BIN_DIR" >> "$GITHUB_PATH"
          echo "✅ Found clang at $CLANG_BIN_DIR/clang"
        else
          echo "::warning::greenforce_clang did not provide clang and no system clang found."
        fi

    - name: 'Build Kernel'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      env:
        PYTHONWARNINGS: "ignore:invalid escape sequence"
      run: |
        set -euo pipefail
        echo "::group::Build kernel with ccache optimization"

        PAGE_SIZE="${{ inputs.page_size }}"
        sed -i 's/check_defconfig//' ./common/build.config.gki 2>/dev/null || true

        cd "$COMMON_KERNEL_FOLDER"
        : > "$COMMON_KERNEL_FOLDER/.scmversion"

        export PYTHONWARNINGS="${PYTHONWARNINGS}"

        WORKSPACE="${GITHUB_WORKSPACE}"
        MAP="-fdebug-prefix-map=${WORKSPACE}=."
        MPMAP="-fmacro-prefix-map=${WORKSPACE}=."
        FPMAP="-ffile-prefix-map=${WORKSPACE}=."

        export KCFLAGS="${KCFLAGS:-} $MAP $MPMAP $FPMAP -no-canonical-prefixes -fdiagnostics-color=never -Qunused-arguments -Wno-unused-command-line-argument -D__ANDROID_COMMON_KERNEL__"
        export KCPPFLAGS="${KCPPFLAGS:-} $MAP $MPMAP $FPMAP"

        export LLVM=1 LLVM_IAS=1
        export ARCH=arm64 SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export PAHOLE="$KERNEL_PLATFORM_FOLDER/prebuilts/kernel-build-tools/linux-x86/bin/pahole"
        export LD=ld.lld HOSTLD=ld.lld AR=llvm-ar NM=llvm-nm
        export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

        set +u
        source "$KERNEL_PLATFORM_FOLDER/build/kernel/_setup_env.sh" 2>/dev/null || true
        set -u

        echo '#!/bin/bash' > "$COMMON_KERNEL_FOLDER/ld-wrapper"
        echo 'ld.lld "$@" --thinlto-jobs=$(nproc --all)' >> "$COMMON_KERNEL_FOLDER/ld-wrapper"
        chmod +x "$COMMON_KERNEL_FOLDER/ld-wrapper"

        KERNEL_BUILD_DATE=$(date -u)
        if [ -n "${{ inputs.build_timestamp }}" ]; then
          export KBUILD_BUILD_TIMESTAMP="${{ inputs.build_timestamp }}"
          echo "📅 Using custom build timestamp: $KBUILD_BUILD_TIMESTAMP"
        else
          export KBUILD_BUILD_TIMESTAMP="$KERNEL_BUILD_DATE"
          echo "📅 Using current UTC build timestamp: $KBUILD_BUILD_TIMESTAMP"
        fi

        if [ -n "${SOURCE_DATE_EPOCH:-}" ]; then
          echo "Using provided SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
        else
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct 2>/dev/null || echo "$(date +%s)")
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH was not set; using git epoch: $SOURCE_DATE_EPOCH"
        fi

        echo "EFFECTIVE_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP" >> "$GITHUB_ENV"
        export KBUILD_BUILD_USER="${BUILD_USER:-kernel}"
        export KBUILD_BUILD_HOST="${BUILD_HOST:-kleaf}"
        export KBUILD_BUILD_VERSION=1
        echo "🔢 SOURCE_DATE_EPOCH: $SOURCE_DATE_EPOCH"
        echo "👤 Build user: $KBUILD_BUILD_USER"
        echo "🖥️  Build host: $KBUILD_BUILD_HOST"

        if [ -n "${CLANG_BIN_PATH:-}" ] && [ -x "${CLANG_BIN_PATH}/clang" ]; then
          echo "Using clang from CLANG_BIN_PATH=${CLANG_BIN_PATH}"
          export CC="ccache ${CLANG_BIN_PATH}/clang"
          export CXX="ccache ${CLANG_BIN_PATH}/clang++"
          export HOSTCC="ccache ${CLANG_BIN_PATH}/clang"
          export HOSTCXX="ccache ${CLANG_BIN_PATH}/clang++"
          if [ -x "${CLANG_BIN_PATH}/ld.lld" ]; then
            export LD="${CLANG_BIN_PATH}/ld.lld"
            export HOSTLD="${CLANG_BIN_PATH}/ld.lld"
          fi
          if [ -d "${CLANG_BIN_PATH}/../lib" ]; then
            echo "LIBCLANG_PATH=${CLANG_BIN_PATH}/../lib" >> "$GITHUB_ENV"
          fi
        else
          echo "Using system clang (or default 'clang' in PATH)"
          export CC="ccache clang"
          export CXX="ccache clang++"
          export HOSTCC="ccache clang"
          export HOSTCXX="ccache clang++"
        fi

          echo "🚀 ccache-accelerated build"

        OUT=/home/runner/out
        mkdir -p "$OUT"

        echo "============================================"
        echo "🔍 Compiler & ccache Verification"
        echo "============================================"
        echo "PATH: ${PATH:0:200}..."
        echo "which clang: $(which clang || true)"
        echo "CC: $CC"
        echo "CXX: $CXX"
        echo "CCACHE_BASEDIR: ${CCACHE_BASEDIR:-not set}"
        echo ""

        echo "ccache wrapper test:"
        clang --version 2>&1 | head -n1 || true
        echo ""

        echo "ccache configuration:"
        ccache -p | grep -E "(compression|direct_mode|readonly_direct|depend|sloppiness)" || true
        echo ""

        echo "ccache pre-build status:"
        ccache -s | head -n 20
        echo "============================================"

        make LD="$COMMON_KERNEL_FOLDER/ld-wrapper" HOSTLD="$COMMON_KERNEL_FOLDER/ld-wrapper" O="$OUT" gki_defconfig

        if [ "${{ inputs.optimize_level }}" != "O2" ]; then
          echo "::warning::optimize_level is set to '${{ inputs.optimize_level }}' but this workflow is intentionally fixed to O2."
        fi
        KCFLAGS_EXTRA="-O2"

        scripts/config --file "$OUT/.config" -e LTO_CLANG_FULL
        make LD="$COMMON_KERNEL_FOLDER/ld-wrapper" HOSTLD="$COMMON_KERNEL_FOLDER/ld-wrapper" O="$OUT" olddefconfig

        KCFLAGS="$KCFLAGS -Wno-error -pipe ${KCFLAGS_EXTRA}"
        KCPPFLAGS="$KCPPFLAGS -DCONFIG_OPTIMIZE_INLINING"

        echo "=== Build Configuration ==="
        echo "Kernel: ${KERNEL_FULL_VER:-unknown}"
        echo "Clang: ${CLANG_BIN_PATH:-(from PATH)}"
        echo "Threads: $(nproc --all)"
        echo "Optimization: O2"
        echo "Timestamp: $KBUILD_BUILD_TIMESTAMP"

        echo "ccache: ENABLED"
        echo "  Dir: $CCACHE_DIR"
        echo "  Base: $CCACHE_BASEDIR"
        echo "  Max size: $CCACHE_MAXSIZE"
        echo "============================================"

        BUILD_START=$(date +%s)
        set -o pipefail

          make LD="$COMMON_KERNEL_FOLDER/ld-wrapper" HOSTLD="$COMMON_KERNEL_FOLDER/ld-wrapper" -j"$(nproc --all)" O="$OUT" KCFLAGS="$KCFLAGS" KCPPFLAGS="$KCPPFLAGS" CONFIG_FAKE_DISABLE="$CONFIG_FAKE_DISABLE" Image 2>&1 | tee build.log

        BUILD_END=$(date +%s)
        BUILD_TIME=$((BUILD_END - BUILD_START))

        echo "BUILD_START=$BUILD_START" >> "$GITHUB_ENV"
        echo "BUILD_END=$BUILD_END" >> "$GITHUB_ENV"
        echo "BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"

        IMG="$OUT/arch/arm64/boot/Image"
        if [ ! -f "$IMG" ]; then
          echo "::error::Kernel Image missing"
          echo "::group::Last 100 lines of build log"
          tail -n 100 build.log || echo "Build log not available"
          echo "::endgroup::"
          exit 1
        fi

        IMG_SIZE=$(stat -c%s "$IMG")

        echo "============================================"
        echo "✅ Build Completed Successfully"
        echo "============================================"
        echo "Duration: $((BUILD_TIME / 60))m $((BUILD_TIME % 60))s"
        echo "Image: $(numfmt --to=iec-i --suffix=B "$IMG_SIZE")"

        echo ""
        echo "📊 ccache Post-Build Statistics"
        echo "============================================"
        ccache -s || true
        echo "============================================"
        echo "::endgroup::"

    - name: 'Verify Page Size in Generated .config'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        PAGE_SIZE="${{ inputs.page_size }}"

        CONFIG_FILE=""
        for candidate in \
          bazel-bin/common/kernel_aarch64_config/out_dir/.config \
          /home/runner/out/.config; do
          if [ -f "$candidate" ]; then CONFIG_FILE="$candidate"; break; fi
        done
        if [ -z "$CONFIG_FILE" ]; then
          CONFIG_FILE="$(find bazel-bin/common /home/runner/out -maxdepth 4 -name .config -type f 2>/dev/null | head -n1 || true)"
        fi
        if [ -z "$CONFIG_FILE" ]; then
          if [ "$PAGE_SIZE" != "16k" ]; then
            echo "WARNING: no .config found; skipping page-size verification for 4k."
            exit 0
          fi
          echo "ERROR: could not locate the generated .config; page size cannot be verified." >&2
          exit 1
        fi
        echo "Verifying page size using $CONFIG_FILE"
        grep -E '^(# )?CONFIG_ARM64_(4K|16K|64K)_PAGES|^CONFIG_ARM64_PAGE_SHIFT' "$CONFIG_FILE" || true

        if [ "$PAGE_SIZE" = "16k" ]; then
          want_on="CONFIG_ARM64_16K_PAGES=y"
          want_off="# CONFIG_ARM64_4K_PAGES is not set"
        else
          want_on="CONFIG_ARM64_4K_PAGES=y"
          want_off="# CONFIG_ARM64_16K_PAGES is not set"
        fi

        if ! grep -qx "$want_on" "$CONFIG_FILE"; then
          echo "ERROR: expected '$want_on' in $CONFIG_FILE" >&2
          grep -E '^(# )?CONFIG_ARM64_(4K|16K|64K)_PAGES' "$CONFIG_FILE" >&2 || true
          exit 1
        fi
        if ! grep -qx "$want_off" "$CONFIG_FILE"; then
          echo "ERROR: expected '$want_off' in $CONFIG_FILE" >&2
          grep -E '^(# )?CONFIG_ARM64_(4K|16K|64K)_PAGES' "$CONFIG_FILE" >&2 || true
          exit 1
        fi
        echo "Page size verified: ${PAGE_SIZE}"

    - name: 'Gather Build Artifacts'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        if [ -f "/home/runner/out/arch/arm64/boot/Image" ]; then
          echo "Found Image at /home/runner/out/arch/arm64/boot/Image"
          cp "/home/runner/out/arch/arm64/boot/Image" "${{ github.workspace }}/AnyKernel3/Image"
          exit 0
        fi

        if [ -f "bazel-bin/common/kernel_aarch64/Image" ]; then
          echo "Found Image at bazel-bin/common/kernel_aarch64/Image"
          cp "bazel-bin/common/kernel_aarch64/Image" "${{ github.workspace }}/AnyKernel3/Image"
          exit 0
        fi

        if [ -f "/home/runner/out/dist/Image" ]; then
          echo "Found Image at /home/runner/out/dist/Image"
          cp "/home/runner/out/dist/Image" "${{ github.workspace }}/AnyKernel3/Image"
          exit 0
        fi

        exit 1
