name: 'Build Kernel'
description: 'Build GKI kernels with the latest Neutron Clang and a direct LLVM Kbuild'
inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.1)'
    required: true
  page_size:
    description: 'ARM64 page size: 4k or 16k'
    required: false
    type: string
    default: '4k'
  allow_version_mismatch:
    description: 'Whether to force-load version-mismatched modules'
    required: false
    type: boolean
    default: false

runs:
  using: composite
  steps:
    - name: Install latest Neutron Clang
      shell: bash
      env:
        NEUTRON_DIR: ${{ github.workspace }}/toolchains/neutron-clang
      run: |
        set -euo pipefail
        mkdir -p "$NEUTRON_DIR"
        cd "$NEUTRON_DIR"

        curl --fail --location --retry 5 --retry-delay 3 --retry-all-errors \
          https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman \
          --output antman
        chmod +x antman

        ./antman --sync=latest --noconfirm --noprogress

        test -x "$NEUTRON_DIR/bin/clang"
        test -x "$NEUTRON_DIR/bin/ld.lld"

        echo "$NEUTRON_DIR/bin" >> "$GITHUB_PATH"
        echo "NEUTRON_CLANG_BIN=$NEUTRON_DIR/bin" >> "$GITHUB_ENV"

        "$NEUTRON_DIR/bin/clang" --version | head -n 1
        grep -A1 '^\[tag\]' "$NEUTRON_DIR/build.info" || true

    - name: Build GKI kernel with LLVM
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        test -x "$NEUTRON_CLANG_BIN/clang"
        test -x "$NEUTRON_CLANG_BIN/ld.lld"

        export PATH="$NEUTRON_CLANG_BIN:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export LLVM=1
        export LLVM_IAS=1
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_COMPAT=aarch64-linux-gnu-
        export LD="$NEUTRON_CLANG_BIN/ld.lld"
        export HOSTLD="$NEUTRON_CLANG_BIN/ld.lld"
        export AR="$NEUTRON_CLANG_BIN/llvm-ar"
        export NM="$NEUTRON_CLANG_BIN/llvm-nm"
        export OBJCOPY="$NEUTRON_CLANG_BIN/llvm-objcopy"
        export OBJDUMP="$NEUTRON_CLANG_BIN/llvm-objdump"
        export STRIP="$NEUTRON_CLANG_BIN/llvm-strip"
        export CC="ccache $NEUTRON_CLANG_BIN/clang"
        export CXX="ccache $NEUTRON_CLANG_BIN/clang++"
        export HOSTCC="ccache $NEUTRON_CLANG_BIN/clang"
        export HOSTCXX="ccache $NEUTRON_CLANG_BIN/clang++"

        echo "Compiler:"
        $NEUTRON_CLANG_BIN/clang --version | head -n 1
        ccache -s || true

        MAKE_JOBS="$(nproc --all)"
        OUT=out
        mkdir -p "$OUT"

        make -j"$MAKE_JOBS" \
          LLVM=1 LLVM_IAS=1 \
          LD="$LD" HOSTLD="$HOSTLD" \
          AR="$AR" NM="$NM" \
          OBJCOPY="$OBJCOPY" OBJDUMP="$OBJDUMP" STRIP="$STRIP" \
          CC="$CC" CXX="$CXX" \
          HOSTCC="$HOSTCC" HOSTCXX="$HOSTCXX" \
          O="$OUT" \
          gki_defconfig

        if [ -f common/wild_defconfig.fragment ]; then
          scripts/kconfig/merge_config.sh \
            -m -O "$OUT" "$OUT/.config" \
            common/wild_defconfig.fragment
        else
          echo "::warning::common/wild_defconfig.fragment not found"
        fi

        make -j"$MAKE_JOBS" \
          LLVM=1 LLVM_IAS=1 \
          LD="$LD" HOSTLD="$HOSTLD" \
          AR="$AR" NM="$NM" \
          OBJCOPY="$OBJCOPY" OBJDUMP="$OBJDUMP" STRIP="$STRIP" \
          CC="$CC" CXX="$CXX" \
          HOSTCC="$HOSTCC" HOSTCXX="$HOSTCXX" \
          O="$OUT" \
          olddefconfig

        make -j"$MAKE_JOBS" \
          LLVM=1 LLVM_IAS=1 \
          LD="$LD" HOSTLD="$HOSTLD" \
          AR="$AR" NM="$NM" \
          OBJCOPY="$OBJCOPY" OBJDUMP="$OBJDUMP" STRIP="$STRIP" \
          CC="$CC" CXX="$CXX" \
          HOSTCC="$HOSTCC" HOSTCXX="$HOSTCXX" \
          O="$OUT" \
          Image modules 2>&1 | tee build.log

        if [ -f "$OUT/arch/arm64/boot/Image" ]; then
          cp "$OUT/arch/arm64/boot/Image" \
            "${{ github.workspace }}/AnyKernel3/Image"
        elif [ -f "$OUT/dist/Image" ]; then
          cp "$OUT/dist/Image" \
            "${{ github.workspace }}/AnyKernel3/Image"
        else
          tail -n 100 build.log || true
          echo "::error::Kernel Image was not produced"
          exit 1
        fi

        echo "Post-build ccache statistics:"
        ccache -s

    - name: Verify generated configuration
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        CONFIG_FILE="out/.config"
        test -f "$CONFIG_FILE"

        if [ "${{ inputs.page_size }}" = "16k" ]; then
          grep -qx 'CONFIG_ARM64_16K_PAGES=y' "$CONFIG_FILE"
          grep -qx '# CONFIG_ARM64_4K_PAGES is not set' "$CONFIG_FILE"
        else
          grep -qx 'CONFIG_ARM64_4K_PAGES=y' "$CONFIG_FILE"
          grep -qx '# CONFIG_ARM64_16K_PAGES is not set' "$CONFIG_FILE"
        fi        
