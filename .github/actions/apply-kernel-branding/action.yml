name: 'Apply Kernel Branding & Timestamp'
description: 'Apply kernel branding to kernel version string'
inputs:
  variant:
    description: 'Variant of kernel to apply branding to'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  version:
    description: 'Combined version (e.g., android14-6.1)'
    required: true
  sublevel:
    description: 'Sublevel of kernel version (e.g., 1)'
    required: true
  keep_kmi:
    description: 'Keep stock KMI generation suffix (e.g., -8) and append it to the version. Off = legacy version format.'
    required: false
    default: 'false'
  image_path:
    description: 'Optional built kernel image to inspect after compilation'
    required: false
    default: ''
outputs:
  kernel_uname:
    description: 'Full Linux version line from the built image, when image_path is supplied'
    value: ${{ steps.check.outputs.kernel_uname }}
runs:
  using: "composite"
  steps:
    - name: Resolve KMI generation and rewrite localversion
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail

        VERSION="${{ inputs.version }}"
        ANDROID_PART="${VERSION%%-*}"
        KERNEL_PART="${VERSION#*-}"
        KEEP_KMI="${{ inputs.keep_kmi }}"

        # Resolve KMI generation from actual build config files. Do not silently
        # fall back to the legacy format when the user explicitly requested KMI.
        KMI=""
        if [ "$KEEP_KMI" = "true" ]; then
          for file in \
            build.config.common \
            build.config.constants \
            common/build.config.common \
            common/build.config.constants; do
            if [ -f "$file" ]; then
              KMI="$(grep -E '^[[:space:]]*KMI_GENERATION[[:space:]]*=' "$file" 2>/dev/null | head -n1 | cut -d= -f2- | tr -d '[:space:]' || true)"
              if [ -n "$KMI" ]; then
                break
              fi
            fi
          done

          if [ -z "$KMI" ]; then
            echo "ERROR: keep_kmi=true but KMI_GENERATION was not found in build.config.*; refusing to build without a KMI suffix." >&2
            exit 1
          fi
          echo "Detected KMI_GENERATION=$KMI"
        fi

        if [ ! -f scripts/setlocalversion ]; then
          echo "ERROR: scripts/setlocalversion not found in $PWD" >&2
          exit 1
        fi

        if [ "$KEEP_KMI" = "true" ] && [ -n "$KMI" ]; then
          # Preserve the upstream-computed SCM suffix (-g<sha>) and BUILD_NUMBER
          # suffix (-ab<number>). Only insert Android/KMI between the kernel
          # release and those dynamic suffixes.
          sed -i '$d' scripts/setlocalversion
          cat >> scripts/setlocalversion <<EOF
        if [ -z "\${res:-}" ]; then
          echo "ERROR: setlocalversion did not compute res; cannot preserve SCM/build suffixes." >&2
          exit 1
        fi
        kernel_base="${KERNEL_PART}.${{ inputs.sublevel }}"
        case "\$res" in
          "\$kernel_base"*) ;;
          *)
            echo "ERROR: setlocalversion res='\$res' does not start with expected kernel base '\$kernel_base'." >&2
            exit 1
            ;;
        esac
        local_suffix="\${res#"\$kernel_base"}"
        echo "\${kernel_base}-${ANDROID_PART}-${KMI}\${local_suffix}"
        EOF
        else
          if [[ "${{ inputs.version }}" == "android15-6.6" || "${{ inputs.version }}" == "android16-6.12" || "${{ inputs.version }}" == "android17-6.18" ]]; then
            KERNEL_STRING="$KERNEL_PART.${{ inputs.sublevel }}-$ANDROID_PART"
            sed -i '$d' scripts/setlocalversion
            printf 'echo "%s"\n' "$KERNEL_STRING" >> scripts/setlocalversion
          else
            sed -i '$d' scripts/setlocalversion
            printf 'echo "-%s"\n' "$ANDROID_PART" >> scripts/setlocalversion
          fi
        fi

        chmod +x scripts/setlocalversion
        echo "--- setlocalversion tail ---"
        tail -n 16 scripts/setlocalversion

    - name: Check built kernel version string
      id: check
      if: inputs.image_path != ''
      shell: bash
      env:
        IMG: ${{ inputs.image_path }}
      run: |
        set -euo pipefail
        if [[ ! -s "$IMG" ]]; then
          echo "ERROR: built kernel image not found or empty: $IMG" >&2
          exit 1
        fi

        KERNEL_UNAME="$(strings "$IMG" | grep -E 'Linux version.*#' | tail -n1 || true)"
        if [[ -z "$KERNEL_UNAME" ]]; then
          echo "ERROR: Linux version line containing build number (#) not found in $IMG" >&2
          exit 1
        fi

        echo "Kernel Uname: $KERNEL_UNAME"
        echo "KERNEL_UNAME=$KERNEL_UNAME" >> "$GITHUB_ENV"
        echo "kernel_uname=$KERNEL_UNAME" >> "$GITHUB_OUTPUT"
