name: 'Keep Stock Kernel Version String'
description: 'Leave the upstream kernel version string unchanged'
inputs:
  variant:
    description: 'Accepted for compatibility; does not affect the kernel version string'
    required: false
  kernel_version:
    description: 'Accepted for compatibility; does not affect the kernel version string'
    required: false
  android_version:
    description: 'Accepted for compatibility; does not affect the kernel version string'
    required: false
  version:
    description: 'Accepted for compatibility; does not affect the kernel version string'
    required: false
  sublevel:
    description: 'Accepted for compatibility; does not affect the kernel version string'
    required: false
  brand_name:
    description: 'Accepted for compatibility; ignored to preserve the stock kernel version string'
    required: false
  keep_kmi:
    description: 'Accepted for compatibility; ignored to preserve the stock kernel version string'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Keep upstream kernel version string
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        test -f scripts/setlocalversion
        echo 'Leaving scripts/setlocalversion unchanged; using the upstream kernel version string.'
