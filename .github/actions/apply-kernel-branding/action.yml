name: 'Apply Kernel Build Branding'
description: 'Set build identity without modifying the kernel local version/KMI'
inputs:
  brand_name:
    description: 'Build username branding (empty = stock build user)'
    required: false
    default: thefloresto

runs:
  using: "composite"
  steps:
    - name: Apply Kernel Build Branding
      shell: bash
      run: |
        BRAND="${{ inputs.brand_name }}"
        if [ -z "$BRAND" ]; then
          echo "brand_name is empty, keeping stock build identity"
          echo "KERNEL_BUILD_USER=" >> "$GITHUB_ENV"
          echo "KERNEL_BUILD_HOST=" >> "$GITHUB_ENV"
          exit 0
        fi

        case "${ROOT_IMPLEMENTATION:-none}" in
          next) ROOT_NAME="KernelSU-Next" ;;
          kernelsu) ROOT_NAME="KernelSU" ;;
          bakasu) ROOT_NAME="BakaSU" ;;
          sukisu-ultra) ROOT_NAME="SukiSU-Ultra" ;;
          kowsu) ROOT_NAME="KowSU" ;;
          finasu) ROOT_NAME="FinaSU" ;;
          none) ROOT_NAME="NoRoot" ;;
          *) ROOT_NAME="NoRoot" ;;
        esac

        ROOT_VERSION=""
        if [ -n "${ROOT_VERSION_CODE:-}" ]; then
          ROOT_VERSION="$ROOT_VERSION_CODE"
        elif [ -n "${ROOT_VERSION:-}" ] && [ "${ROOT_VERSION}" != "N/A" ]; then
          ROOT_VERSION="$ROOT_VERSION"
        fi

        if [ -n "$ROOT_VERSION" ]; then
          BUILD_USER="${BRAND}@${ROOT_NAME}-v${ROOT_VERSION}"
        else
          BUILD_USER="${BRAND}@${ROOT_NAME}"
        fi

        echo "KERNEL_BUILD_USER=$BUILD_USER" >> "$GITHUB_ENV"
        echo "KERNEL_BUILD_HOST=build-host" >> "$GITHUB_ENV"
        echo "Build identity: $BUILD_USER"
        echo "Build host: build-host"
