name: 'Setup VPNHide'
description: 'Clones the vpnhide repository, applies patches using Python integrator and configures built-in modules'
inputs:
  version:
    description: 'GKI Kernel KMI version (e.g., android14-6.1 or android15-6.6)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Clone vpnhide Repository
      shell: bash
      run: |
        set -euo pipefail
        git clone --depth=1 https://github.com/okhsunrog/vpnhide.git vpnhide

    - name: Install UV and Apply vpnhide Patches
      shell: bash
      run: |
        set -euo pipefail
        
        # 1. Устанавливаем uv (необходим для запуска integrate.py)
        curl -LsSf https://astral.sh | sh
        export PATH="$HOME/.local/bin:$PATH"
        
        # 2. Запускаем современный скрипт интеграции builtin-бэкенда
        # Скрипт требует указать путь к ядру (--kernel), версию KMI (--kmi) и новую папку для отчетов (--output)
        uv run --project vpnhide vpnhide/builtin/scripts/integrate.py apply \
          --kernel "${{ github.workspace }}/kernel/common" \
          --kmi "${{ inputs.version }}" \
          --output "${{ github.workspace }}/vpnhide_review_bundle"

    - name: Configure vpnhide
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail

        # 1. Добавляем флаг сборки модуля в дефконфиг
        CFG_FILE="arch/arm64/configs/gki_defconfig"
        if ! grep -q "CONFIG_VPNHIDE" "$CFG_FILE"; then
          echo "Appending CONFIG_VPNHIDE=y to $CFG_FILE..."
          echo "CONFIG_VPNHIDE=y" >> "$CFG_FILE"
        fi

        # 2. Отключаем проверку check_defconfig в Bazel для предотвращения ошибок сборки из-за изменения gki_defconfig
        BUILD_BAZEL="BUILD.bazel"
        if [ -f "$BUILD_BAZEL" ]; then
          sed -i '/check_defconfig =/d' "$BUILD_BAZEL"
          sed -i '/name = "kernel_aarch64",/a\    check_defconfig = "disabled",' "$BUILD_BAZEL"
          echo "Disabled check_defconfig in BUILD.bazel"
        fi

    - name: Cleanup vpnhide Repository
      shell: bash
      run: |
        rm -rf vpnhide
