name: Fetch Root Managers

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      root_flavor:
        description: "Root flavor to fetch managers for"
        type: choice
        options:
          - All
          - KernelSU-Next
          - KernelSU
          - BakaSU
          - SukiSU-Ultra
          - KowSU
          - No Root
          - KernelSU-Next-SUSFS
          - FinaSU
        default: All
      kernelsu_next_commit:
        description: "Pin KernelSU-Next manager to this commit (40-char SHA, empty = latest dev tip)"
        required: false
        type: string
        default: ""
      kernelsu_commit:
        description: "Pin KernelSU manager to this commit (40-char SHA, empty = latest main tip)"
        required: false
        type: string
        default: ""
      bakasu_commit:
        description: "Pin BakaSU manager to this commit (40-char SHA, empty = latest main tip)"
        required: false
        type: string
        default: ""
      sukisu_ultra_commit:
        description: "Pin SukiSU-Ultra manager to this commit (40-char SHA, empty = latest main tip)"
        required: false
        type: string
        default: ""
      kernelsu_next_susfs_commit:
        description: "Pin KernelSU-Next SUSFS (pershoot dev-susfs) manager to this commit (40-char SHA, empty = latest dev-susfs tip)"
        required: false
        type: string
        default: ""
      finasu_commit:
        description: "Pin FinaSU manager to this commit (40-char SHA, empty = latest master tip)"
        required: false
        type: string
        default: ""
      build_from_source:
        description: "Build from source — clone each repo at the pinned commit and build LKM + ksud + manager locally (instead of fetching upstream CI artifacts)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      root_flavor:
        description: "Root flavor to fetch managers for"
        required: false
        type: string
        default: All
      kernelsu_next_commit:
        description: "Pin KernelSU-Next manager commit"
        required: false
        type: string
        default: ""
      kernelsu_commit:
        description: "Pin KernelSU manager commit"
        required: false
        type: string
        default: ""
      bakasu_commit:
        description: "Pin BakaSU manager commit"
        required: false
        type: string
        default: ""
      sukisu_ultra_commit:
        description: "Pin SukiSU-Ultra manager commit"
        required: false
        type: string
        default: ""
      kernelsu_next_susfs_commit:
        description: "Pin KernelSU-Next SUSFS manager commit"
        required: false
        type: string
        default: ""
      finasu_commit:
        description: "Pin FinaSU manager commit"
        required: false
        type: string
        default: ""
      build_from_source:
        description: "Build from source instead of fetching artifacts"
        required: false
        type: boolean
        default: false

jobs:
  # ── path A: fetch prebuilt manager APKs from upstream CI (default) ──
  resolve-managers:
    if: ${{ !inputs.build_from_source }}
    runs-on: ubuntu-latest
    outputs:
      manager_list: ${{ steps.manager.outputs.manager_list }}
    steps:
      - name: Resolve manager builds for selected root flavor(s)
        id: manager
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ROOT_FLAVOR: ${{ inputs.root_flavor }}
          INPUT_NEXT_COMMIT: ${{ inputs.kernelsu_next_commit }}
          INPUT_KSU_COMMIT: ${{ inputs.kernelsu_commit }}
          INPUT_BAKASU_COMMIT: ${{ inputs.bakasu_commit }}
          INPUT_SUKISU_ULTRA_COMMIT: ${{ inputs.sukisu_ultra_commit }}
          INPUT_NEXT_SUSFS_COMMIT: ${{ inputs.kernelsu_next_susfs_commit }}
          INPUT_FINASU_COMMIT: ${{ inputs.finasu_commit }}
        run: |
          set -euo pipefail

          # Credit: authenticated gh-API manager lookup adapted from EmberHeart-Kernels
          # commit ae9a341 (nullptr-t-oss/composite_actions fetch_ksu_manager).
          # Exact extraction of main.yml#resolve-managers / manager step.
          # Each selected root must ship ALL manager APK builds. KernelSU-Next publishes
          # its manager APKs (manager + manager-spoofed) from the official dev-tip
          # build-manager-ci run; kernelsu (KernelSU), BakaSU, SukiSU-Ultra,
          # and KowSU expose theirs as CI-run artifacts. All are pinned to an exact commit.
          # No Root ships no manager.

          retry() {
            local n=0
            until [ "$n" -ge 5 ]; do
              "$@" && return 0
              n=$((n+1))
              echo "retry $n/5 failed for: $*" >&2
              sleep 5
            done
            return 1
          }

          resolve_sha() { # repo ref
            retry git ls-remote "$1" "$2" | awk '{print $1; exit}'
          }

          resolve_one() { # flavor
            local flavor="$1"
            local owner repo wf stock
            case "$flavor" in
              next)
                owner="KernelSU-Next"; repo="KernelSU-Next"; wf="build-manager-ci.yml"
                if [[ -n "${INPUT_NEXT_COMMIT:-}" ]]; then
                  stock="$INPUT_NEXT_COMMIT"
                  if ! [[ "$stock" =~ ^[0-9a-f]{40}$ ]]; then
                    echo "ERROR: kernelsu_next_commit must be a 40-char SHA (got: $stock)" >&2
                    exit 1
                  fi
                else
                  stock=$(resolve_sha https://github.com/KernelSU-Next/KernelSU-Next.git refs/heads/dev)
                fi
                run_id=$(gh api "repos/${owner}/${repo}/actions/workflows/${wf}/runs?head_sha=${stock}" \
                  --jq '.workflow_runs[0].id // empty')
                if [[ -z "${run_id}" ]]; then
                  if [[ -z "${INPUT_NEXT_COMMIT:-}" ]]; then
                    echo "No manager build for dev tip ${stock}, falling back to latest successful run" >&2
                    fb=$(gh api "repos/${owner}/${repo}/actions/workflows/${wf}/runs?branch=dev&status=success&per_page=1")
                    run_id=$(echo "$fb" | jq -r '.workflow_runs[0].id // empty')
                    stock=$(echo "$fb" | jq -r '.workflow_runs[0].head_sha // empty')
                    if [[ -n "$run_id" ]]; then echo "Fallback to ${stock} run ${run_id}" >&2; fi
                  fi
                  if [[ -z "${run_id}" ]]; then
                    echo "ERROR: no ${repo} manager build exists for dev commit ${stock}" >&2
                    exit 1
                  fi
                fi
                printf '{"flavor":"%s","owner":"%s","repo":"%s","source":"run","run_id":%s,"stock":"%s","want":"manager,manager-spoofed"}' \
                  "$flavor" "$owner" "$repo" "$run_id" "$stock"
                ;;

              kernelsu)
                owner="tiann"; repo="KernelSU"; wf="build-manager.yml"
                if [[ -n "${INPUT_KSU_COMMIT:-}" ]]; then
                  stock="$INPUT_KSU_COMMIT"
                  if ! [[ "$stock" =~ ^[0-9a-f]{40}$ ]]; then
                    echo "ERROR: kernelsu_commit must be a 40-char SHA (got: $stock)" >&2
                    exit 1
                  fi
                else
                  stock=$(resolve_sha https://github.com/tiann/KernelSU.git refs/heads/main)
                fi
                run_id=$(gh api "repos/${owner}/${repo}/actions/workflows/${wf}/runs?head_sha=${stock}" \
                  --jq '.workflow_runs[0].id // empty')
                if [[ -z "${run_id}" ]]; then
                  if [[ -z "${INPUT_KSU_COMMIT:-}" ]]; then
                    echo "No manager build for stock ${stock}, falling back to latest successful run" >&2
                    fb=$(gh api "repos/${owner}/${repo}/actions/workflows/${wf}/runs?branch=main&status=success&per_page=1")
                    run_id=$(echo "$fb" | jq -r '.workflow_runs[0].id // empty')
                    stock=$(echo "$fb" | jq -r '.workflow_runs[0].head_sha // empty')
                    if [[ -n "$run_id" ]]; then echo "Fallback to ${stock} run ${run_id}" >&2; fi
                  fi
                  if [[ -z "${run_id}" ]]; then
                    echo "ERROR: no ${repo} manager build exists for stock commit ${stock}" >&2
                    exit 1
                  fi
                fi
                printf '{"flavor":"%s","owner":"%s","repo":"%s","source":"run","run_id":%s,"stock":"%s","want":"manager"}' \
                  "$flavor" "$owner" "$repo" "$run_id" "$stock"
                ;;

              next-susfs)
                owner="pershoot"; repo="KernelSU-Next"; wf="build-manager-ci.yml"
                if [[ -n "${INPUT_NEXT_SUSFS_COMMIT:-}" ]]; then
                  stock="$INPUT_NEXT_SUSFS_COMMIT"
                  if ! [[ "$stock" =~ ^[0-9a-f]{40}$ ]]; then
                    echo "ERROR: kernelsu_next_susfs_commit must be a 40-char SHA (got: $stock)" >&2
                    exit 1
                  fi
                else
                  stock=$(resolve_sha https://github.com/pershoot/KernelSU-Next.git refs/heads/dev-susfs)
                  # fallback to upstream KernelSU-Next dev-susfs if pershoot fork tip not found
                  if ! [[ "$stock" =~ ^[0-9a-f]{40}$ ]]; then
                    stock=$(resolve_sha https://github.com/KernelSU-Next/KernelSU-Next.git refs/heads/dev-susfs)
                  fi
                fi
                run_id=$(gh api "repos/${owner}/${repo}/actions/workflows/${wf}/runs?head_sha=${stock}" \
                  --jq '.workflow_runs[0].id // empty')
                if [[ -z "${run_id}" ]]; then
                  if [[ -z "${INPUT_NEXT_SUSFS_COMMIT:-}" ]]; then
                    echo "No manager build for dev-susfs tip ${stock}, falling back to latest successful run" >&2
                    fb=$(gh api "repos/${owner}/${repo}/actions/workflows/${wf}/runs?branch=dev-susfs&status=success&per_page=1")
                    run_id=$(echo "$fb" | jq -r '.workflow_runs[0].id // empty')
                    stock=$(echo "$fb" | jq -r '.workflow_runs[0].head_sha // empty')
                    if [[ -z "$run_id" ]]; then
                      # dev-susfs has no CI on this fork — try dev fallback
                      echo "No dev-susfs CI run, trying dev branch fallback" >&2
                      fb=$(gh api "repos/${owner}/${repo}/actions/workflows/${wf}/runs?branch=dev&status=success&per_page=1")
                      run_id=$(echo "$fb" | jq -r '.workflow_runs[0].id // empty')
                      stock=$(echo "$fb" | jq -r '.workflow_runs[0].head_sha // empty')
                    fi
                    if [[ -n "$run_id" ]]; then echo "Fallback to ${stock} run ${run_id}" >&2; fi
                  fi
                  if [[ -z "${run_id}" ]]; then
                    echo "WARNING: no ${owner}/${repo} manager build for dev-susfs commit ${stock} — will need build_from_source" >&2
                    # emit empty want so fetch path skips gracefully; source build will handle it
                    printf '{"flavor":"%s","owner":"%s","repo":"%s","source":"run","run_id":null,"stock":"%s","want":"manager,manager-spoofed","note":"no-ci-run"}' \
                      "$flavor" "$owner" "$repo" "$stock"
                    return 0
                  fi
                fi
                printf '{"flavor":"%s","owner":"%s","repo":"%s","source":"run","run_id":%s,"stock":"%s","want":"manager,manager-spoofed"}' \
                  "$flavor" "$owner" "$repo" "$run_id" "$stock"
                ;;

              bakasu)
                owner="Baka-SU"; repo="BakaSU"; wf="build-manager.yml"
                if [[ -n "${INPUT_BAKASU_COMMIT:-}" ]]; then
                  stock="$INPUT_BAKASU_COMMIT"
                  if ! [[ "$stock" =~ ^[0-9a-f]{40}$ ]]; then
                    echo "ERROR: bakasu_commit must be a 40-char SHA (got: $stock)" >&2
                    exit 1
                  fi
                else
                  stock=$(resolve_sha https://github.com/Baka-SU/BakaSU.git refs/heads/main)
                fi
                run_id=$(gh api "repos/${owner}/${repo}/actions/workflows/${wf}/runs?head_sha=${stock}" \
                  --jq '.workflow_runs[0].id // empty')
                if [[ -z "${run_id}" ]]; then
                  if [[ -z "${INPUT_BAKASU_COMMIT:-}" ]]; then
                    echo "No manager build for stock ${stock}, falling back to latest successful run" >&2
                    fb=$(gh api "repos/${owner}/${repo}/actions/workflows/${wf}/runs?branch=main&status=success&per_page=1")
                    run_id=$(echo "$fb" | jq -r '.workflow_runs[0].id // empty')
                    stock=$(echo "$fb" | jq -r '.workflow_runs[0].head_sha // empty')
                    if [[ -n "$run_id" ]]; then echo "Fallback to ${stock} run ${run_id}" >&2; fi
                  fi
                  if [[ -z "${run_id}" ]]; then
                    echo "ERROR: no ${repo} manager build exists for stock commit ${stock}" >&2
                    exit 1
                  fi
                fi
                printf '{"flavor":"%s","owner":"%s","repo":"%s","source":"run","run_id":%s,"stock":"%s","want":"Manager-release,Spoofed-Manager-release"}' \
                  "$flavor" "$owner" "$repo" "$run_id" "$stock"
                ;;

+              finasu)
+                owner="LyraVoid"; repo="FinaSU"; wf="build-manager.yml"
+                if [[ -n "${INPUT_FINASU_COMMIT:-}" ]]; then
+                  stock="$INPUT_FINASU_COMMIT"
+                  if ! [[ "$stock" =~ ^[0-9a-f]{40}$ ]]; then
+                    echo "ERROR: finasu_commit must be a 40-char SHA (got: $stock)" >&2
+                    exit 1
+                  fi
+                else
+                  stock=$(resolve_sha https://github.com/LyraVoid/FinaSU.git refs/heads/master)
+                fi
+                run_id=$(gh api "repos/${owner}/${repo}/actions/workflows/${wf}/runs?head_sha=${stock}" \
+                  --jq '.workflow_runs[0].id // empty')
+                if [[ -z "${run_id}" ]]; then
+                  if [[ -z "${INPUT_FINASU_COMMIT:-}" ]]; then
+                    echo "No manager build for stock ${stock}, falling back to latest successful run" >&2
+                    fb=$(gh api "repos/${owner}/${repo}/actions/workflows/${wf}/runs?branch=master&status=success&per_page=1")
+                    run_id=$(echo "$fb" | jq -r '.workflow_runs[0].id // empty')
+                    stock=$(echo "$fb" | jq -r '.workflow_runs[0].head_sha // empty')
+                    if [[ -n "$run_id" ]]; then echo "Fallback to ${stock} run ${run_id}" >&2; fi
+                  fi
+                  if [[ -z "${run_id}" ]]; then
+                    echo "ERROR: no ${repo} manager build exists for stock commit ${stock}" >&2
+                    exit 1
+                  fi
+                fi
+                printf '{"flavor":"%s","owner":"%s","repo":"%s","source":"run","run_id":%s,"stock":"%s","want":"manager"}' \
+                  "$flavor" "$owner" "$repo" "$run_id" "$stock"
+                ;;
+
               sukisu-ultra)
                 owner="SukiSU-Ultra"; repo="SukiSU-Ultra"; wf="build-manager.yml"
                 if [[ -n "${INPUT_SUKISU_ULTRA_COMMIT:-}" ]]; then
                   stock="$INPUT_SUKISU_ULTRA_COMMIT"
                   if ! [[ "$stock" =~ ^[0-9a-f]{40}$ ]]; then
                     echo "ERROR: sukisu_ultra_commit must be a 40-char SHA (got: $stock)" >&2
                     exit 1
                   fi
                 else
                   stock=$(resolve_sha https://github.com/SukiSU-Ultra/SukiSU-Ultra.git refs/heads/main)
                 fi
                 run_id=$(gh api "repos/${owner}/${repo}/actions/workflows/${wf}/runs?head_sha=${stock}" \
                   --jq '.workflow_runs[0].id // empty')
                 if [[ -z "${run_id}" ]]; then
                   if [[ -z "${INPUT_SUKISU_ULTRA_COMMIT:-}" ]]; then
                     echo "No manager build for stock ${stock}, falling back to latest successful run" >&2
                     fb=$(gh api "repos/${owner}/${repo}/actions/workflows/${wf}/runs?branch=main&status=success&per_page=1")
                     run_id=$(echo "$fb" | jq -r '.workflow_runs[0].id // empty')
                     stock=$(echo "$fb" | jq -r '.workflow_runs[0].head_sha // empty')
                     if [[ -n "$run_id" ]]; then echo "Fallback to ${stock} run ${run_id}" >&2; fi
                   fi
                   if [[ -z "${run_id}" ]]; then
                     echo "ERROR: no ${repo} manager build exists for stock commit ${stock}" >&2
                     exit 1
                   fi
                 fi
                 printf '{"flavor":"%s","owner":"%s","repo":"%s","source":"run","run_id":%s,"stock":"%s","want":"Manager,Spoofed-Manager"}' \
                   "$flavor" "$owner" "$repo" "$run_id" "$stock"
                 ;;
@@
-          All) LIST=$(jq -c -n '[inputs]' <<< "$(resolve_one next)"$'\n'"$(resolve_one next-susfs)"$'\n'"$(resolve_one kernelsu)"$'\n'"$(resolve_one bakasu)") ;;
+          All) LIST=$(jq -c -n '[inputs]' <<< "$(resolve_one next)"$'\n'"$(resolve_one next-susfs)"$'\n'"$(resolve_one kernelsu)"$'\n'"$(resolve_one bakasu)"$'\n'"$(resolve_one suski su-ultra)"$'\n'"$(resolve_one sukisu-ultra)"$'\n'"$(resolve_one finasu)") ;;
           KernelSU-Next) LIST=$(jq -c -n '[inputs]' <<< "$(resolve_one next)") ;;
           KernelSU-Next-SUSFS) LIST=$(jq -c -n '[inputs]' <<< "$(resolve_one next-susfs)") ;;
           KernelSU) LIST=$(jq -c -n '[inputs]' <<< "$(resolve_one kernelsu)") ;;
           BakaSU) LIST=$(jq -c -n '[inputs]' <<< "$(resolve_one bakasu)") ;;
-          SukiSU-Ultra) LIST=$(jq -c -n '[inputs]' <<< "$(resolve_one sukisu-ultra)") ;;
+          SukiSU-Ultra) LIST=$(jq -c -n '[inputs]' <<< "$(resolve_one sukisu-ultra)") ;;
+          FinaSU) LIST=$(jq -c -n '[inputs]' <<< "$(resolve_one finasu)") ;;
           KowSU) LIST=$(jq -c -n '[inputs]' <<< "$(resolve_one kowsu)") ;;
           *) echo "Skipping manager resolution (no root flavor / none)." ;;
           esac
           if [ -n "$LIST" ]; then
             echo "manager_list=$LIST" >> "$GITHUB_OUTPUT"
             echo "Manager sources resolved: $LIST"
           else
             echo "manager_list=[]" >> "$GITHUB_OUTPUT"
           fi

  list-manager-apks:
    needs: resolve-managers
    if: ${{ !inputs.build_from_source && needs.resolve-managers.outputs.manager_list != '' && needs.resolve-managers.outputs.manager_list != '[]' }}
    runs-on: ubuntu-latest
    outputs:
      apk_list: ${{ steps.scan.outputs.apk_list }}
    steps:
      - uses: actions/checkout@v7

      - name: Download and scan all manager APKs
        id: scan
        shell: bash
        env:
          MANAGER_LIST: ${{ needs.resolve-managers.outputs.manager_list }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MANAGER_LIST=$(echo "$MANAGER_LIST" | sed 's/^\[,/[/')
          if ! echo "$MANAGER_LIST" | jq empty 2>/dev/null; then
            echo "ERROR: Invalid MANAGER_LIST JSON"
            echo "Raw: $MANAGER_LIST"
            exit 0
          fi
          OUT_APKS="${GITHUB_WORKSPACE:-$PWD}/manager_apks"
          MANIFEST="${GITHUB_WORKSPACE:-$PWD}/manifest.txt"
          rm -rf "$OUT_APKS" "$MANIFEST"
          mkdir -p "$OUT_APKS"
          : > "$MANIFEST"
          echo "$MANAGER_LIST" | jq -c '.[] | select(.run_id != null and .run_id != "null")' | while read -r M; do
            OWNER=$(echo "$M" | jq -r .owner)
            REPO=$(echo "$M" | jq -r .repo)
            SRC=$(echo "$M" | jq -r .source)
            RUN_ID=$(echo "$M" | jq -r .run_id)
            WANT=$(echo "$M" | jq -r '.want // ""')
            DLDIR="dl_${REPO}"
            mkdir -p "$DLDIR"
            (
              cd "$DLDIR"
              if [ "$SRC" = "release" ]; then
                curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  "https://api.github.com/repos/${OWNER}/${REPO}/releases/latest" > rel.json
                for URL in $(jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' rel.json); do
                  NAME="${URL##*/}"
                  curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$NAME" "$URL"
                  cp -f "$NAME" "$OUT_APKS/$NAME"
                  echo "$OWNER|$REPO|$NAME" >> "$MANIFEST"
                done
              else
                AJSON=$(curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  "https://api.github.com/repos/${OWNER}/${REPO}/actions/runs/${RUN_ID}/artifacts")
                if [ -z "$WANT" ]; then
                  ART_IDS=$(echo "$AJSON" | jq -r '.artifacts[].id')
                else
                  ART_IDS=$(echo "$AJSON" | jq -r --arg want "$WANT" '
                    ($want | split(",")) as $wl |
                    .artifacts[] | select(.name as $n | any($wl[]; $n == .)) | .id')
                fi
                echo "$ART_IDS" | while read -r AID; do
                  [ -n "$AID" ] || continue
                  curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    -o "_${AID}.zip" \
                    "https://api.github.com/repos/${OWNER}/${REPO}/actions/artifacts/${AID}/zip"
                  mkdir -p "_${AID}"
                  unzip -o -q "_${AID}.zip" -d "_${AID}" || true
                  rm -f "_${AID}.zip"
                  for apk in _${AID}/*.apk; do
                    [ -f "$apk" ] || continue
                    NAME="$(basename "$apk")"
                    cp -f "$apk" "$OUT_APKS/$NAME"
                    echo "$OWNER|$REPO|$NAME" >> "$MANIFEST"
                  done
                  rm -rf "_${AID}"
                done
              fi
            )
          done
          # Filter BakaSU to only release universal and universal spoofed
          if grep -q "Baka-SU|BakaSU|" "$MANIFEST" 2>/dev/null; then
            tmp_manifest="${MANIFEST}.filtered"
            : > "$tmp_manifest"
            while IFS='|' read -r o r n; do
              [ -n "$n" ] || continue
              if [ "$o" = "Baka-SU" ] && [ "$r" = "BakaSU" ]; then
                ln=$(echo "$n" | tr '[:upper:]' '[:lower:]')
                if [[ "$ln" != *universal* ]]; then echo "Dropping BakaSU non-universal $n" >&2; rm -f "$OUT_APKS/$n"; continue; fi
                if [[ "$ln" == *debug* ]]; then echo "Dropping BakaSU debug $n" >&2; rm -f "$OUT_APKS/$n"; continue; fi
              fi
              echo "$o|$r|$n" >> "$tmp_manifest"
            done < "$MANIFEST"
            mv "$tmp_manifest" "$MANIFEST"
          fi
          APK_JSON="[]"
          while IFS='|' read -r o r n; do
            [ -n "$n" ] || continue
            APK_JSON=$(echo "$APK_JSON" | jq -c --arg o "$o" --arg r "$r" --arg n "$n" \
              '. + [{owner:$o,repo:$r,apk:$n}]')
          done < "$MANIFEST"
          echo "apk_list=${APK_JSON}" >> "$GITHUB_OUTPUT"
          echo "Found $(wc -l < "$MANIFEST" 2>/dev/null | tr -d ' ' || echo 0) manager APKs"
          ls -lh "$OUT_APKS" || true

      - name: Upload all manager APKs as one cross-blob
        uses: actions/upload-artifact@v7
        with:
          name: manager-apks
          path: manager_apks/
          if-no-files-found: ignore

  # ── path B: build from source — mirror upstream workflow order ──
  # Upstream: build-lkm -> build-ksuinit -> build-ksud (matrix) -> build-manager (needs ksud, copies to jniLibs)
  # We mirror that order so manager embeds ksud correctly. No extra gradle.properties edits beside your key.
  build-ksud-from-source:
    if: ${{ inputs.build_from_source }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: next
            repo: https://github.com/KernelSU-Next/KernelSU-Next.git
            ref: dev
          - flavor: next-susfs
            repo: https://github.com/pershoot/KernelSU-Next.git
            ref: dev-susfs
          - flavor: kernelsu
            repo: https://github.com/tiann/KernelSU.git
            ref: main
          - flavor: bakasu
            repo: https://github.com/Baka-SU/BakaSU.git
            ref: main
          - flavor: sukisu-ultra
            repo: https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
            ref: main
+          - flavor: finasu
+            repo: https://github.com/LyraVoid/FinaSU.git
+            ref: master
          - flavor: kowsu
            repo: https://github.com/KOWX712/KernelSU.git
            ref: master
    steps:
      - name: Gate on root_flavor filter
        id: gate
        shell: bash
        env:
          ROOT_FLAVOR: ${{ inputs.root_flavor }}
        run: |
          WANT="${{ inputs.root_flavor }}"
          WANT="${WANT:-All}"
          FLAVOR="${{ matrix.flavor }}"
          case "$WANT" in
            All*) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            KernelSU-Next) [[ "$FLAVOR" == "next" ]] && echo "run=true" >> "$GITHUB_OUTPUT" || echo "run=false" >> "$GITHUB_OUTPUT" ;;
